[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "submarine-toolbox"
version = "2.0.0"
description = "Modular submarine subsystem simulation with 3D viewer and PyQt5 panels"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "PyQt5",
    "pyqtgraph>=0.13.3",
    "PyOpenGL",
]

[project.urls]
Homepage = "https://github.com/gaschenb/Submarine-Toolbox"
Repository = "https://github.com/gaschenb/Submarine-Toolbox"

[project.scripts]
submarine-toolbox = "submarine_toolbox.main:main"
submarine-run = "submarine_toolbox.cli:main"

[tool.setuptools.packages.find]
include = ["submarine_toolbox*"]

